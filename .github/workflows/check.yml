name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26.10"
      # the release the skills were written for: the checksum database vouches for the source
      - name: Install staircase
        run: |
          go install "github.com/b070nd/stAirCase/src/cmd/staircase@$(cat STAIRCASE_VERSION)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check the skills
        run: make check
